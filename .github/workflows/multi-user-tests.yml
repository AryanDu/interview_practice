name: Final quality and security checks

on:
  pull_request:
    paths:
      - "app.py"
      - "ui/**"
      - "utils/**"
      - "chains/**"
      - "tests/**"
      - "requirements.txt"
      - ".streamlit/config.toml"
      - "docs/**"
      - ".gitignore"
      - ".github/workflows/multi-user-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "app.py"
      - "ui/**"
      - "utils/**"
      - "chains/**"
      - "tests/**"
      - "requirements.txt"
      - ".streamlit/config.toml"
      - "docs/**"
      - ".gitignore"
      - ".github/workflows/multi-user-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "streamlit>=1.42.0" pandas requests pypdf streamlit-autorefresh "psycopg[binary,pool]>=3.2.3" reportlab pytest pydantic jinja2 pillow
      - name: Compile all Python source and tests
        run: python -m compileall -q app.py ui utils chains tests
      - name: Run multi-user persistence, security-guard and PDF report tests
        run: python -m pytest -q tests/test_quiz_tracker_multiuser.py tests/test_mock_interview_reports.py tests/test_security_guard.py

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Bandit
        run: python -m pip install --upgrade bandit
      - name: Scan Python source
        run: bandit -r app.py ui utils chains -ll

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit
      - name: Audit Python dependencies (documented ChromaDB advisory exception)
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan working tree and available Git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
